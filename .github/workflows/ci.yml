name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [go.mod]
        include:
          # The oldest Go the README says can build it. go.mod asks for a
          # newer one, which Go 1.21 and later fetch by themselves; this job
          # checks that they do.
          - os: ubuntu-latest
            go: "1.21"
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}

      - name: Go version in use
        run: go version

      # The tests make commits of their own. A runner has no identity to
      # make them with, and Git for Windows would turn the line endings of
      # the files they write and read back.
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global core.autocrlf false
          git config --global init.defaultBranch main

      - name: Vet
        run: go vet ./...

      - name: Formatting
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      # The race detector needs cgo, which the Windows runner is not set up
      # for; there the tests run without it.
      - name: Test
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

  build:
    name: build (BSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: |
          for target in freebsd/amd64 openbsd/amd64 netbsd/amd64 freebsd/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null .
          done
